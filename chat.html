<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twitch Chat Overlay</title>
<!--
  OBS browser-source Twitch chat with 7TV / BTTV / FFZ emotes, 7TV paints & badges.

  Config: pass URL params (OBS "Local file" unticked), e.g.
    Linux/macOS: file:///home/slendog/Projects/twitch_chat/chat.html?channel=xqc&size=22&fade=30
    Windows:     file:///C:/Users/YourName/Documents/twitch_chat/chat.html?channel=xqc&size=22&fade=30
  or, with OBS "Local file" ticked (no URL params possible), edit DEFAULTS in the script below.

  Params:
    channel       Twitch channel login (required)
    size          font size in px                         (default 20)
    emoteScale    emote height relative to font size      (default 1.6)
    max           max messages kept on screen             (default 40)
    fade          seconds before a message fades, 0 = off (default 0)
    badges        1/0 show Twitch badges                   (default 1)
    paints        1/0 show 7TV paints + badges             (default 1)
    hideCommands  1/0 hide messages starting with "!"      (default 1)
    hideBots      comma list of extra usernames to hide
    notices       1/0 show sub/raid notices                (default 1)
    font          CSS font-family                          (default Inter)
    gifs          1/0 show Twitch chat GIFs                (default 1)
    gifHeight     GIF height in px                         (default 150)
    prefetch      1/0 preload all emote images on start    (default 1)
    loader        1/0 show the loading bar                 (default 1)

  See README.md for details.
-->
<!-- Resolve/connect to every host up front, in parallel, instead of on first use. -->
<link rel="preconnect" href="https://7tv.io" crossorigin>
<link rel="preconnect" href="https://cdn.7tv.app">
<link rel="preconnect" href="https://api.betterttv.net" crossorigin>
<link rel="preconnect" href="https://cdn.betterttv.net">
<link rel="preconnect" href="https://api.frankerfacez.com" crossorigin>
<link rel="preconnect" href="https://cdn.frankerfacez.com">
<link rel="preconnect" href="https://api.ivr.fi" crossorigin>
<link rel="preconnect" href="https://static-cdn.jtvnw.net">
<link rel="preconnect" href="https://events.7tv.io">
<link rel="preconnect" href="https://irc-ws.chat.twitch.tv">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font loads without blocking the page. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --size: 20px;
    --emote: 1.6em;
    --gif: 150px;
    --font: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    --outline: 0 0 2px #000, 0 0 2px #000, 1px 1px 2px #000;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    font-family: var(--font);
    font-size: var(--size);
    font-weight: 700;
    color: #fff;
  }
  #chat {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .msg {
    line-height: 1.55;
    text-shadow: var(--outline);
    overflow-wrap: anywhere;
    animation: slide-in .25s ease-out;
  }
  .msg.fading { animation: fade-out .6s ease-in forwards; }
  .msg.action .body { font-style: italic; }
  .msg.notice {
    padding: 2px 8px;
    border-left: 3px solid #9147ff;
    background: rgba(145, 71, 255, .18);
    border-radius: 4px;
  }
  .msg.notice .sys { color: #d6c2ff; font-weight: 500; font-style: italic; }
  .msg.status { color: #aaa; font-weight: 500; font-size: .8em; }

  .badges img {
    height: 1.05em;
    vertical-align: middle;
    margin-right: 4px;
    position: relative;
    top: -.08em;
  }
  .name { font-weight: 800; }
  .name.painted {
    text-shadow: none;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }
  .colon { margin-right: .3em; }
  .mention { font-weight: 800; }
  .gif {
    display: block;
    height: var(--gif);
    max-width: 100%;
    object-fit: contain;
    object-position: left;
    margin: 4px 0 2px;
    border-radius: 6px;
  }

  .emote {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    margin: -.45em 1px -.35em;
  }
  .stack { display: grid; }
  .stack > img {
    grid-area: 1 / 1;
    height: var(--emote);
    justify-self: center;
    align-self: center;
  }

  /* FFZ modifier effects. Each effect is its own wrapper so they stack. */
  .fx { display: inline-flex; align-items: center; }
  .fx-flip-x { transform: scaleX(-1); }
  .fx-flip-y { transform: scaleY(-1); }
  .fx-cursed { filter: grayscale(1) brightness(.7) contrast(2.5); }
  .fx-hyper-red { filter: brightness(.6) sepia(1) saturate(20) hue-rotate(-25deg); }
  .fx-rainbow { animation: fx-rainbow 2s linear infinite; }
  .fx-shake { animation: fx-shake .15s linear infinite; }
  .fx-spin { animation: fx-spin 1.5s linear infinite; }
  .fx-slide { animation: fx-slide 2s ease-in-out infinite alternate; }
  .fx-arrive { animation: fx-arrive 3s ease-out infinite; }
  .fx-leave { animation: fx-leave 3s ease-in infinite; }
  .fx-jam { animation: fx-jam .6s ease-in-out infinite alternate; transform-origin: bottom center; }
  .fx-bounce { animation: fx-bounce .45s ease-in-out infinite alternate; transform-origin: bottom center; }
  @keyframes fx-rainbow { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  @keyframes fx-shake {
    0%   { transform: translate(1px, -1px); }
    25%  { transform: translate(-2px, 1px); }
    50%  { transform: translate(1px, 2px); }
    75%  { transform: translate(-1px, -2px); }
    100% { transform: translate(2px, 0); }
  }
  @keyframes fx-spin { to { transform: rotate(360deg); } }
  @keyframes fx-slide { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
  @keyframes fx-arrive {
    0%        { transform: translateX(-150%); opacity: 0; }
    40%, 100% { transform: none; opacity: 1; }
  }
  @keyframes fx-leave {
    0%, 60% { transform: none; opacity: 1; }
    100%    { transform: translateX(150%); opacity: 0; }
  }
  @keyframes fx-jam {
    from { transform: rotate(-10deg); }
    to   { transform: rotate(10deg) translateY(-8%); }
  }
  @keyframes fx-bounce {
    from { transform: scale(1.1, .85); }
    to   { transform: translateY(-25%) scale(.95, 1.05); }
  }

  #loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    transition: opacity .8s ease;
    pointer-events: none;
  }
  #loader.done { opacity: 0; }
  #loader .track { height: 3px; background: rgba(255, 255, 255, .15); }
  #loader .fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #9147ff, #29b6f6);
    transition: width .2s ease;
  }
  #loader .label {
    display: inline-block;
    margin: 3px 8px;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255, 255, 255, .8);
    text-shadow: var(--outline);
  }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fade-out {
    to { opacity: 0; }
  }
</style>
</head>
<body>
<div id="loader" hidden><div class="track"><div class="fill"></div></div><span class="label">Loading emotes…</span></div>
<div id="chat"></div>

<script>
'use strict';

// ---------------------------------------------------------------- config
const DEFAULTS = {
  channel: 'CHANNEL_NAME_HERE',
  size: 20,
  emoteScale: 1.6,
  max: 40,
  fade: 0,
  badges: true,
  paints: true,
  hideCommands: true,
  notices: true,
  gifs: true,
  gifHeight: 150,
  prefetch: true,
  loader: true,
  hideBots: 'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot,sery_bot,soundalerts,kofistreambot',
  font: '',
};

const params = new URLSearchParams(location.search);
const flag = (k) => params.has(k) ? !/^(0|false|no|off)$/i.test(params.get(k)) : DEFAULTS[k];
const num = (k) => params.has(k) && !isNaN(+params.get(k)) ? +params.get(k) : DEFAULTS[k];

// Each URL param is parsed according to the type of its default.
const CONFIG = Object.fromEntries(Object.entries(DEFAULTS).map(([k, v]) =>
  [k, typeof v === 'boolean' ? flag(k) : typeof v === 'number' ? num(k) : params.get(k) || v]));
CONFIG.channel = CONFIG.channel.toLowerCase().replace(/^#/, '');

// hideBots adds to the default list instead of replacing it.
const hiddenUsers = new Set(
  (DEFAULTS.hideBots + ',' + (params.get('hideBots') || '')).toLowerCase().split(',').map(s => s.trim()).filter(Boolean)
);

document.documentElement.style.setProperty('--size', CONFIG.size + 'px');
document.documentElement.style.setProperty('--emote', CONFIG.emoteScale + 'em');
document.documentElement.style.setProperty('--gif', CONFIG.gifHeight + 'px');
if (CONFIG.font) document.documentElement.style.setProperty('--font', CONFIG.font);

// Pick image resolution from rendered emote height (assumes DPR 1 in OBS).
const HI_RES = CONFIG.size * CONFIG.emoteScale > 56;

const chatEl = document.getElementById('chat');

// ---------------------------------------------------------------- helpers
// Times out after 10s: some APIs (FFZ especially) occasionally never answer,
// which would otherwise stall loading forever.
async function getJSON(url, opts) {
  const r = await fetch(url, { signal: AbortSignal.timeout(10000), ...opts });
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}

// 404 = no account on that service; treat as empty.
const orEmpty = (fallback) => (e) => { if (e.message.startsWith('404')) return fallback; throw e; };

async function allSettledLogged(label, promises) {
  const res = await Promise.allSettled(promises);
  res.forEach(r => r.status === 'rejected' && console.warn(label, r.reason));
}

// Limits concurrent requests (7TV per-user lookups, image prefetch).
function limiter(max) {
  let active = 0;
  const queue = [];
  const next = () => {
    if (active >= max || !queue.length) return;
    active++;
    const { fn, resolve, reject } = queue.shift();
    fn().then(resolve, reject).finally(() => { active--; next(); });
  };
  return (fn) => new Promise((resolve, reject) => { queue.push({ fn, resolve, reject }); next(); });
}

// WebSocket that reconnects with exponential backoff (1s up to 30s).
// With json: true, messages are sent and received as JSON.
function reconnectingSocket(url, { onOpen, onMessage, json = false }) {
  let ws;
  let backoff = 1000;
  const sock = {
    send(data) { if (ws?.readyState === WebSocket.OPEN) ws.send(json ? JSON.stringify(data) : data); },
    close() { ws?.close(); },
  };
  const open = () => {
    ws = new WebSocket(url);
    ws.onopen = () => { backoff = 1000; onOpen(sock); };
    ws.onmessage = (ev) => {
      if (!json) return onMessage(ev.data);
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      onMessage(m);
    };
    ws.onclose = () => {
      setTimeout(open, backoff);
      backoff = Math.min(backoff * 2, 30000);
    };
  };
  open();
  return sock;
}

function makeImg(src, alt, className) {
  const img = document.createElement('img');
  img.src = src;
  img.alt = alt;
  img.decoding = 'async';
  if (className) img.className = className;
  return img;
}

const stvAsset = (host, size) => `https:${host}/${size}.webp`;
const byName = (list) => new Map(list.map(e => [e.name, e]));
function buildMap(list, add) {
  const m = new Map();
  list.forEach(e => add(m, e));
  return m;
}

// 7TV packs colors as signed 32-bit RGBA ints.
function rgba(n) {
  if (n == null) return null;
  n >>>= 0;
  return `rgba(${(n >>> 24) & 255}, ${(n >>> 16) & 255}, ${(n >>> 8) & 255}, ${((n & 255) / 255).toFixed(3)})`;
}

const DEFAULT_COLORS = [
  '#FF0000', '#0000FF', '#00FF00', '#B22222', '#FF7F50', '#9ACD32', '#FF4500', '#2E8B57',
  '#DAA520', '#D2691E', '#5F9EA0', '#1E90FF', '#FF69B4', '#8A2BE2', '#00FF7F',
];
function fallbackColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0;
  return DEFAULT_COLORS[Math.abs(h) % DEFAULT_COLORS.length];
}

// Lift very dark name colors so they stay readable on stream.
function readableColor(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  if (lum >= 60) return '#' + m[1];
  const k = 60 / Math.max(lum, 1);
  r = Math.min(255, Math.round(r * k + 40));
  g = Math.min(255, Math.round(g * k + 40));
  b = Math.min(255, Math.round(b * k + 40));
  return `rgb(${r}, ${g}, ${b})`;
}

// ---------------------------------------------------------------- emotes
const CHANNEL_KEYS = ['stvChannel', 'bttvChannel', 'ffzChannel'];
const GLOBAL_KEYS = ['stvGlobal', 'bttvGlobal', 'ffzGlobal'];
// Lookup order: channel emotes beat globals; 7TV > BTTV > FFZ.
const LOOKUP_ORDER = [...CHANNEL_KEYS, ...GLOBAL_KEYS];
const emoteMaps = Object.fromEntries(LOOKUP_ORDER.map(k => [k, new Map()]));

// Emote maps that apply to one chatter, highest priority first: their 7TV
// personal sets, their FFZ supporter sets, then the shared channel/global maps.
function scopesFor(userId, login) {
  const scopes = [];
  for (const id of userSets.get(userId) || []) {
    const m = personalSets.get(id);
    if (m) scopes.push(m);
  }
  for (const s of ffzUserSets) if (s.users.has(login)) scopes.push(s.map);
  for (const k of LOOKUP_ORDER) scopes.push(emoteMaps[k]);
  return scopes;
}

function findEmote(word, scopes) {
  for (const m of scopes) {
    const e = m.get(word);
    if (e) return e;
  }
  return null;
}

// BTTV global overlay emotes (they render on top of the previous emote).
const BTTV_ZERO_WIDTH = new Set(['SoSnowy', 'IceCold', 'SantaHat', 'TopHat', 'ReinDeer', 'CandyCane', 'cvMask', 'cvHazmat']);

function add7tv(map, e) {
  map.set(e.name, {
    name: e.name,
    url: stvAsset(e.data?.host?.url || `//cdn.7tv.app/emote/${e.id}`, HI_RES ? '4x' : '2x'),
    zw: Boolean((e.flags & 1) || (e.data?.flags & 256)),
  });
}
function addBttv(map, e) {
  map.set(e.code, {
    id: e.id,
    name: e.code,
    url: `https://cdn.betterttv.net/emote/${e.id}/${HI_RES ? '3x' : '2x'}`,
    zw: BTTV_ZERO_WIDTH.has(e.code) || e.modifier === true,
  });
}

// FFZ modifier flags. Hidden modifiers only change the previous emote;
// non-hidden modifiers are drawn on top of it (like 7TV zero-width).
const FFZ_HIDDEN = 1;
const FFZ_WIDE = 8;
const FFZ_EFFECTS = [
  [2, 'fx-flip-x'], [4, 'fx-flip-y'], [16, 'fx-slide'], [32, 'fx-arrive'], [64, 'fx-leave'],
  [128, 'fx-spin'], [2048, 'fx-rainbow'], [4096, 'fx-hyper-red'], [8192, 'fx-shake'],
  [16384, 'fx-cursed'], [32768, 'fx-jam'], [65536, 'fx-bounce'],
];

function addFfz(map, e) {
  const urls = e.animated || e.urls || {};
  let url = (HI_RES ? urls['4'] || urls['2'] : urls['2']) || urls['1'];
  if (url?.startsWith('//')) url = 'https:' + url;
  const flags = e.modifier ? (e.modifier_flags || 0) : 0;
  map.set(e.name, {
    name: e.name,
    url,
    zw: e.modifier === true && !(flags & FFZ_HIDDEN),
    hidden: Boolean(flags & FFZ_HIDDEN),
    mod: flags & ~FFZ_HIDDEN,
  });
}

// Flattens FFZ API sets (all of them by default) into one list of emoticons.
const ffzEmotes = (sets = {}, ids = Object.keys(sets)) => ids.flatMap(id => sets[id]?.emoticons || []);

// FFZ supporter-only sets ("Subwoofer" effects), keyed by Twitch login.
let ffzUserSets = [];              // [{ users: Set(login), map }]
let ffzSupporterMods = new Set();  // their modifier names, hidden for non-supporters
function setFfzUserSets(sets) {
  ffzUserSets = sets;
  ffzSupporterMods = new Set(sets.flatMap(s => [...s.map.values()].filter(e => e.hidden).map(e => e.name)));
}

// ---------------------------------------------------------------- 7TV personal emotes
// Personal emote sets belong to one chatter and only apply to their messages.
// 7TV announces who owns which set through EventAPI "entitlements" for this channel.
const personalSets = new Map(); // emote set id -> Map(name -> emote)
const userSets = new Map();     // twitch user id -> Set(emote set id)
const fetchedSets = new Set();  // set ids whose contents we already have or requested

function personalSet(id) {
  if (!personalSets.has(id)) personalSets.set(id, new Map());
  return personalSets.get(id);
}

// Set contents usually arrive as events; fetch once if they haven't.
function fetchPersonalSet(id) {
  if (fetchedSets.has(id)) return;
  fetchedSets.add(id);
  getJSON(`https://7tv.io/v3/emote-sets/${id}`)
    .then(d => {
      const map = personalSet(id);
      (d.emotes || []).forEach(e => add7tv(map, e));
      rerenderSetOwners(id);
    })
    .catch(e => console.warn('7tv personal set', e));
}

const twitchIdOf = (user) => user?.connections?.find(c => c.platform === 'TWITCH')?.id;

// A chatter's first message can arrive before their entitlement does;
// re-render matching on-screen messages once the emotes are known.
function rerenderMessages(match) {
  for (const body of chatEl.querySelectorAll('.msg .body')) {
    if (body._msg && match(body._msg)) body.replaceChildren(renderBody(body._msg));
  }
}
const rerenderUser = (userId) => rerenderMessages(m => m.tags['user-id'] === userId);
const rerenderSetOwners = (setId) => rerenderMessages(m => userSets.get(m.tags['user-id'])?.has(setId));

function onEntitlement(type, obj) {
  const userId = twitchIdOf(obj.user);
  if (!userId) return;
  if (obj.kind === 'EMOTE_SET') {
    const setId = obj.ref_id;
    if (type === 'entitlement.create') {
      if (!userSets.has(userId)) userSets.set(userId, new Set());
      userSets.get(userId).add(setId);
      fetchPersonalSet(setId);
      if (personalSet(setId).size) rerenderUser(userId);
    } else {
      const sets = userSets.get(userId);
      sets?.delete(setId);
      if (sets && !sets.size) userSets.delete(userId);
      // Drop the set once nobody owns it, so long sessions don't accumulate them.
      if (![...userSets.values()].some(s => s.has(setId))) {
        personalSets.delete(setId);
        fetchedSets.delete(setId);
      }
      rerenderUser(userId);
    }
  } else if ((obj.kind === 'PAINT' || obj.kind === 'BADGE') && CONFIG.paints && obj.user.style) {
    // Seed the per-user cache so this chatter's paint shows on their first message.
    cacheStyle(userId, resolveStyle(obj.user.style));
  }
}

function applySetUpdate(map, body) {
  for (const p of body.pushed || []) if (p.key === 'emotes' && p.value) add7tv(map, p.value);
  for (const p of body.pulled || []) if (p.key === 'emotes' && p.old_value) map.delete(p.old_value.name);
  for (const u of body.updated || []) {
    if (u.key !== 'emotes') continue;
    if (u.old_value) map.delete(u.old_value.name);
    if (u.value) add7tv(map, u.value);
  }
}

// ---------------------------------------------------------------- live sockets
// One 7TV EventAPI connection: live channel emote changes, active emote set
// switches, personal emotes, paints/badges.
let stvSock = null;
const stvSend = (op, type, condition) => stvSock?.send({ op, d: { type, condition } });

// Subscriptions that follow the channel's current 7TV user and emote set.
const STV_TRACKED = { stvSetId: 'emote_set.update', stvUserId: 'user.update' };
function track(field, id) {
  if (id === channel[field]) return;
  const type = STV_TRACKED[field];
  if (channel[field]) stvSend(36, type, { object_id: channel[field] });
  channel[field] = id;
  if (id) stvSend(35, type, { object_id: id });
}

function on7tvEvent(m) {
  if (m.op !== 0 || !m.d) return;
  const { type, body = {} } = m.d;

  if (type === 'emote_set.update') {
    if (body.id === channel.stvSetId) {
      applySetUpdate(emoteMaps.stvChannel, body);
      channelChanged('7TV emote set updated');
    } else if (personalSets.has(body.id)) {
      applySetUpdate(personalSets.get(body.id), body);
      rerenderSetOwners(body.id);
    }
  } else if (type === 'user.update' && body.id === channel.stvUserId) {
    // Covers the streamer switching their active emote set; just reload it.
    load7tvChannel().then(() => channelChanged('7TV user updated'), e => console.warn('7tv reload', e));
  } else if (type === 'emote_set.create' && body.object?.id) {
    const map = personalSet(body.object.id);
    (body.object.emotes || []).forEach(e => add7tv(map, e));
    fetchedSets.add(body.object.id); // later updates arrive as events, no REST fetch needed
  } else if (type?.startsWith('entitlement.') && body.object) {
    onEntitlement(type, body.object);
  } else if (type === 'cosmetic.create' && body.object?.data?.id) {
    const { kind, data } = body.object;
    if ((kind === 'PAINT' || kind === 'BADGE') && !cosmeticCache.has(data.id)) {
      cosmeticCache.set(data.id, Promise.resolve({ kind: kind.toLowerCase(), ...data }));
    }
  }
}

function connect7tvEvents() {
  stvSock = reconnectingSocket('wss://events.7tv.io/v3', {
    json: true,
    onOpen: () => {
      for (const [field, type] of Object.entries(STV_TRACKED)) {
        if (channel[field]) stvSend(35, type, { object_id: channel[field] });
      }
      const ctx = { ctx: 'channel', platform: 'TWITCH', id: channel.roomId };
      for (const type of ['entitlement.*', 'cosmetic.*', 'emote_set.*']) stvSend(35, type, ctx);
    },
    onMessage: on7tvEvent,
  });
}

// BTTV pushes channel emote changes over its own socket.
function connectBttvEvents() {
  const room = `twitch:${channel.roomId}`;
  reconnectingSocket('wss://sockets.betterttv.net/ws', {
    json: true,
    onOpen: (sock) => sock.send({ name: 'join_channel', data: { name: room } }),
    onMessage: (m) => {
      const d = m.data || {};
      if (d.channel !== room) return;
      const map = emoteMaps.bttvChannel;
      const removeId = (id) => { for (const [k, e] of map) if (e.id === id) map.delete(k); };
      if (m.name === 'emote_create' && d.emote) {
        addBttv(map, d.emote);
      } else if (m.name === 'emote_update' && d.emote) {
        removeId(d.emote.id);
        addBttv(map, d.emote);
      } else if (m.name === 'emote_delete') {
        removeId(d.emoteId);
      } else {
        return;
      }
      channelChanged('BTTV ' + m.name);
    },
  });
}

// ---------------------------------------------------------------- loading progress
// Thin bar at the top: emote lists first (~20%), then image prefetch. Lists
// register themselves as they start; seal() marks that no more will come.
const progress = (() => {
  const el = document.getElementById('loader');
  const fill = el.querySelector('.fill');
  const label = el.querySelector('.label');
  let lists = 0, listsDone = 0, imgs = 0, imgsDone = 0, sealed = false, finished = false;
  el.hidden = !CONFIG.loader;

  function render() {
    if (finished) return;
    const listsLoading = !sealed || listsDone < lists;
    const lp = lists ? listsDone / lists : 0;
    const ip = imgs ? imgsDone / imgs : 1;
    const pct = CONFIG.prefetch ? 0.2 * lp + 0.8 * (listsLoading ? 0 : ip) : lp;
    fill.style.width = (pct * 100).toFixed(1) + '%';
    if (listsLoading) {
      label.textContent = `Loading emote lists… ${listsDone}/${lists}`;
    } else if (imgsDone < imgs) {
      label.textContent = `Loading emotes… ${imgsDone}/${imgs}`;
    } else {
      finished = true;
      const total = LOOKUP_ORDER.reduce((n, k) => n + emoteMaps[k].size, 0);
      label.textContent = `${total} emotes ready`;
      setTimeout(() => el.classList.add('done'), 1500);
      setTimeout(() => { el.hidden = true; }, 2500);
    }
  }
  return {
    addLists(n) { lists += n; render(); },
    listDone() { listsDone++; render(); },
    seal() { sealed = true; render(); },
    addImage() { imgs++; },
    imageDone() { imgsDone++; render(); },
    fail(text) { finished = true; label.textContent = text; fill.style.width = '100%'; fill.style.background = '#e53935'; },
  };
})();

// Each list queues its images before counting as done, so the bar never
// reaches 100% while images are still unknown.
function settle(label, jobs) {
  progress.addLists(jobs.length);
  return allSettledLogged(label, jobs.map(j => j.then(prefetchAll).finally(() => progress.listDone())));
}

// ---------------------------------------------------------------- twitch badges
const badgeMaps = { channel: new Map(), global: new Map() }; // "set/version" -> url
const getBadge = (key) => badgeMaps.channel.get(key) || badgeMaps.global.get(key);
function badgeMap(sets) {
  const m = new Map();
  sets.forEach(s => s.versions.forEach(v =>
    m.set(`${s.set_id}/${v.id}`, v.image_url_4x || v.image_url_2x || v.image_url_1x)));
  return m;
}

// ---------------------------------------------------------------- loaders
// Fresh lists go into a new Map that replaces the old one, so emotes the
// channel removed since the cached copy disappear.
const fillMap = (key, list, add) => { emoteMaps[key] = buildMap(list, add); };

const channelBots = new Set();

}

// After live changes: save the cache and preload new images, batched so a
// burst of edits (or a set switch) costs one write.
let changeTimer = null;

  changeTimer = setTimeout(() => { saveChannelCache(); prefetchAll(); }, 2000);
}

// Room id comes from whichever answers first: cache, ivr.fi lookup, or IRC ROOMSTATE.
// The lookup lets channel emotes start loading without waiting for IRC to join.

    .then(d => {

// ---------------------------------------------------------------- cache
// Emote lists are cached in localStorage so restarts render instantly;
// fresh lists are still fetched every load and replace the cache.
const RES = HI_RES ? 'hi' : 'lo';
const GLOBAL_CACHE = 'global:' + RES;
const CHANNEL_CACHE = `channel:${CONFIG.channel}:${RES}`;
function cacheGet(key) {
  try { return JSON.parse(localStorage.getItem('twitchchat:v2:' + key)); } catch { return null; }
}
function cacheSet(key, value) {
  try { localStorage.setItem('twitchchat:v2:' + key, JSON.stringify(value)); } catch { /* full or blocked */ }
}

const snapshot = (keys) => Object.fromEntries(keys.map(k => [k, [...emoteMaps[k].values()]]));
function restore(snap) {
  for (const [k, list] of Object.entries(snap || {})) if (emoteMaps[k]) emoteMaps[k] = byName(list);
}

function saveGlobalCache() {
  cacheSet(GLOBAL_CACHE, {
    emotes: snapshot(GLOBAL_KEYS),
    badges: [...badgeMaps.global],
    ffzUserSets: ffzUserSets.map(s => ({ users: [...s.users], emotes: [...s.map.values()] })),
  });
}
function restoreGlobalCache() {
  const c = cacheGet(GLOBAL_CACHE);
  if (!c) return false;
  restore(c.emotes);
  badgeMaps.global = new Map(c.badges || []);
  setFfzUserSets((c.ffzUserSets || []).map(s => ({ users: new Set(s.users), map: byName(s.emotes) })));
  return true;
}

function saveChannelCache() {
  cacheSet(CHANNEL_CACHE, {
    roomId: channel.roomId,
    emotes: snapshot(CHANNEL_KEYS),
    badges: [...badgeMaps.channel],
    bots: [...channelBots],
  });
}
function restoreChannelCache() {
  const c = cacheGet(CHANNEL_CACHE);
  if (!c) return false;
  restore(c.emotes);
  badgeMaps.channel = new Map(c.badges || []);
  addChannelBots(c.bots || []);
  resolveRoomId(c.roomId);
  return true;
}

// ---------------------------------------------------------------- image prefetch
// Downloads every emote/badge image once so first use is instant; afterwards
// they're served from the browser's disk cache. Channel emotes go first.
const prefetched = new Set();
const imgLimit = limiter(24);
// Twitch has ~600 global badges; only these show up in most chats.
const COMMON_BADGES = /^(broadcaster|moderator|vip|subscriber|founder|partner|verified|staff|premium|turbo|artist-badge|no_audio|no_video|bits|sub-gifter|sub-gift-leader|bits-leader|glhf-pledge|predictions)\//;
function prefetchAll() {
  if (!CONFIG.prefetch) return;
  const urls = [];
  for (const k of LOOKUP_ORDER) for (const e of emoteMaps[k].values()) urls.push(e.url);
  for (const u of badgeMaps.channel.values()) urls.push(u);
  for (const [k, u] of badgeMaps.global) if (COMMON_BADGES.test(k)) urls.push(u);
  for (const url of urls) {
    if (!url || prefetched.has(url)) continue;
    prefetched.add(url);
    progress.addImage();
    // Plain load, not img.decode(): decoding ~1000 images up front is far slower
    // and the browser decodes on first paint anyway. A CDN that stalls a download
    // frees its slot after 15s so the rest (and the progress bar) keep going.
    imgLimit(() => new Promise(resolve => {
      const img = new Image();
      img.onload = img.onerror = resolve;
      setTimeout(resolve, 15000);
      img.src = url;
    })).then(() => progress.imageDone());
  }
}

// ---------------------------------------------------------------- chat gating
// Chat lines wait (max 8s) until emote lists are in, so early messages
// don't render as plain text.
let chatReady = false;
const backlog = [];
function whenReady(fn) {
  if (chatReady) fn();
  else backlog.push(fn);
}
function markReady() {
  if (chatReady) return;
  chatReady = true;
  backlog.splice(0).forEach(fn => fn());
}

// ---------------------------------------------------------------- 7TV cosmetics
const stvLimit = limiter(4);
const userStyleCache = new Map(); // twitch user id -> Promise<{paint, badge}|null>, oldest first
const STYLE_CACHE_MAX = 5000;
const cosmeticCache = new Map();  // cosmetic id -> Promise<cosmetic|null>
let pendingCosmetics = new Map();
let cosmeticTimer = null;

const COSMETICS_QUERY = `query($list: [ObjectID!]) {
  cosmetics(list: $list) {
    paints { id name function color angle shape image_url repeat stops { at color } shadows { x_offset y_offset radius color } }
    badges { id name tooltip host { url } }
  }
}`;

function getCosmetic(id) {
  if (!id) return Promise.resolve(null);
  if (cosmeticCache.has(id)) return cosmeticCache.get(id);
  const p = new Promise(resolve => pendingCosmetics.set(id, resolve));
  cosmeticCache.set(id, p);
  if (!cosmeticTimer) cosmeticTimer = setTimeout(flushCosmetics, 60);
  return p;
}

// Batch all cosmetic ids requested in a short window into one GQL call.
async function flushCosmetics() {
  const batch = pendingCosmetics;
  pendingCosmetics = new Map();
  cosmeticTimer = null;
  const found = new Map();
  try {
    const d = await getJSON('https://7tv.io/v3/gql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: COSMETICS_QUERY, variables: { list: [...batch.keys()] } }),
    });
    for (const p of d.data?.cosmetics?.paints || []) found.set(p.id, { kind: 'paint', ...p });
    for (const b of d.data?.cosmetics?.badges || []) found.set(b.id, { kind: 'badge', ...b });
  } catch (e) {
    console.warn('7tv cosmetics', e);
    for (const id of batch.keys()) cosmeticCache.delete(id); // allow retry later
  }
  for (const [id, resolve] of batch) resolve(found.get(id) || null);
}

const resolveStyle = (style) => Promise.all([getCosmetic(style?.paint_id), getCosmetic(style?.badge_id)])
  .then(([paint, badge]) => ({ paint, badge }));

// Bounded so a multi-hour session in a busy chat doesn't keep every chatter forever.
function cacheStyle(userId, promise) {
  userStyleCache.delete(userId);
  userStyleCache.set(userId, promise);
  if (userStyleCache.size > STYLE_CACHE_MAX) userStyleCache.delete(userStyleCache.keys().next().value);
}

function get7tvStyle(userId) {
  if (!CONFIG.paints || !userId) return Promise.resolve(null);
  if (!userStyleCache.has(userId)) {
    cacheStyle(userId, stvLimit(() => stvTwitchUser(userId))
      .then(d => d.user ? resolveStyle(d.user.style) : null) // no user = no 7TV account
      .catch(() => null));
  }
  return userStyleCache.get(userId);
}

function paintCss(p) {
  const stops = (p.stops || []).map(s => `${rgba(s.color)} ${(s.at * 100).toFixed(2)}%`).join(', ');
  const rep = p.repeat ? 'repeating-' : '';
  switch (p.function) {
    case 'LINEAR_GRADIENT':
      return stops && `${rep}linear-gradient(${p.angle || 0}deg, ${stops})`;
    case 'RADIAL_GRADIENT':
      return stops && `${rep}radial-gradient(${p.shape || 'circle'}, ${stops})`;
    case 'URL':
      return p.image_url && `url("${p.image_url}")`;
    default:
      return null;
  }
}

function applyPaint(nameEl, paint, baseColor) {
  const img = paintCss(paint);
  if (!img) return;
  nameEl.classList.add('painted');
  nameEl.style.backgroundImage = img;
  nameEl.style.backgroundColor = rgba(paint.color) || baseColor;
  // Paint shadows + a thin outline so painted names stay readable.
  const shadows = (paint.shadows || []).map(s =>
    `drop-shadow(${s.x_offset}px ${s.y_offset}px ${s.radius}px ${rgba(s.color)})`);
  shadows.push('drop-shadow(0 0 1px rgba(0,0,0,.9))');
  nameEl.style.filter = shadows.join(' ');
}

// ---------------------------------------------------------------- rendering
// Wide (ffzW): stretch an image to twice its natural width.
function widenImg(img) {
  const set = () => { img.style.aspectRatio = `${img.naturalWidth * 2} / ${img.naturalHeight}`; };
  if (img.complete && img.naturalWidth) set();
  else img.addEventListener('load', set, { once: true });
}

function applyEffects(em, flags) {
  if (flags & FFZ_WIDE) {
    em.wide = true;
    em.stack.querySelectorAll('img').forEach(widenImg);
  }
  for (const [bit, cls] of FFZ_EFFECTS) {
    if (!(flags & bit)) continue;
    const fx = document.createElement('span');
    fx.className = 'fx ' + cls;
    fx.append(...em.outer.childNodes);
    em.outer.appendChild(fx);
  }
}

// Twitch chat GIFs (GIPHY): "start-end|gifID|gifURL", comma-separated. Split only
// on commas that start a new entry, in case a URL ever contains one.
function parseGifs(tag) {
  const out = [];
  if (!tag) return out;
  for (const m of tag.matchAll(/(\d+)-(\d+)\|([^|]*)\|(.+?)(?=,\d+-\d+\||$)/g)) {
    out.push({ s: +m[1], e: +m[2], gif: m[4] });
  }
  return out;
}

// msg: { text, tags, login }. Kept on the element so it can be re-rendered.
function renderBody(msg) {
  const { text, tags, login } = msg;
  const scopes = scopesFor(tags['user-id'], login);
  const frag = document.createDocumentFragment();
  const chars = Array.from(text); // Twitch emote indices count code points

  const ranges = [];
  for (const part of tags.emotes ? tags.emotes.split('/') : []) {
    const [id, pos] = part.split(':');
    if (!pos) continue;
    for (const r of pos.split(',')) {
      const [s, e] = r.split('-').map(Number);
      ranges.push({ s, e, id });
    }
  }
  if (CONFIG.gifs) ranges.push(...parseGifs(tags.gifs));
  ranges.sort((a, b) => a.s - b.s);

  let lastEmote = null;
  let pendingSpace = '';
  const flushSpace = () => {
    if (pendingSpace) frag.appendChild(document.createTextNode(pendingSpace));
    pendingSpace = '';
  };
  const pushEmote = (e) => {
    // Overlays and modifiers attach to the previous emote; alone they show as normal emotes.
    if (lastEmote && (e.zw || e.hidden)) {
      pendingSpace = '';
      if (e.zw) {
        const img = makeImg(e.url, e.name);
        if (lastEmote.wide) widenImg(img);
        lastEmote.stack.appendChild(img);
      }
      if (e.mod) applyEffects(lastEmote, e.mod);
      lastEmote.outer.title += ' ' + e.name;
      return;
    }
    flushSpace();
    const outer = document.createElement('span');
    outer.className = 'emote';
    outer.title = e.name;
    const stack = document.createElement('span');
    stack.className = 'stack';
    stack.appendChild(makeImg(e.url, e.name));
    outer.appendChild(stack);
    frag.appendChild(outer);
    lastEmote = { outer, stack, wide: false };
  };
  const pushText = (str) => {
    for (const tok of str.split(/(\s+)/)) {
      if (!tok) continue;
      if (/^\s+$/.test(tok)) { pendingSpace += ' '; continue; }
      const e = findEmote(tok, scopes);
      if (e) { pushEmote(e); continue; }
      // FFZ ignores supporter modifiers from non-supporters; hide the word.
      if (lastEmote && ffzSupporterMods.has(tok)) { pendingSpace = ''; continue; }
      flushSpace();
      if (/^@\w+/.test(tok)) {
        const span = document.createElement('span');
        span.className = 'mention';
        span.textContent = tok;
        frag.appendChild(span);
      } else {
        frag.appendChild(document.createTextNode(tok));
      }
      lastEmote = null;
    }
  };

  let i = 0;
  for (const r of ranges) {
    if (r.s < i) continue;
    if (r.s > i) pushText(chars.slice(i, r.s).join(''));
    const name = chars.slice(r.s, r.e + 1).join('');
    if (r.gif) {
      // The placeholder text ("[Title GIF by X]") becomes the image; URL used as given.
      flushSpace();
      const img = makeImg(r.gif, name.replace(/^\[|\]$/g, ''), 'gif');
      img.title = img.alt;
      frag.appendChild(img);
      lastEmote = null;
    } else {
      pushEmote({ url: `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/${HI_RES ? '3.0' : '2.0'}`, name });
    }
    i = r.e + 1;
  }
  if (i < chars.length) pushText(chars.slice(i).join(''));
  flushSpace();
  return frag;
}

function addLine(el) {
  chatEl.appendChild(el);
  while (chatEl.children.length > CONFIG.max) chatEl.firstElementChild.remove();
  if (CONFIG.fade > 0) {
    setTimeout(() => {
      el.classList.add('fading');
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }, CONFIG.fade * 1000);
  }
}

function renderMessage(tags, login, text, { notice = null } = {}) {
  const am = /^\u0001ACTION (.*?)\u0001?$/.exec(text);
  const action = Boolean(am);
  if (am) text = am[1];

  const el = document.createElement('div');
  el.className = 'msg' + (action ? ' action' : '') + (notice ? ' notice' : '');
  if (tags.id) el.dataset.id = tags.id;
  if (tags['user-id']) el.dataset.user = tags['user-id'];

  if (notice) {
    const sys = document.createElement('div');
    sys.className = 'sys';
    sys.textContent = notice;
    el.appendChild(sys);
    if (!text) { addLine(el); return; }
  }

  const color = readableColor(tags.color || fallbackColor(login));

  const badges = document.createElement('span');
  badges.className = 'badges';
  if (CONFIG.badges && tags.badges) {
    for (const b of tags.badges.split(',')) {
      const url = getBadge(b);
      if (url) badges.appendChild(makeImg(url, b));
    }
  }

  const name = document.createElement('span');
  name.className = 'name';
  name.style.color = color;
  const display = tags['display-name'] || login;
  name.textContent = display.toLowerCase() === login ? display : `${display} (${login})`;

  const colon = document.createElement('span');
  colon.className = 'colon';
  colon.textContent = action ? ' ' : ':';

  const body = document.createElement('span');
  body.className = 'body';
  if (action) body.style.color = color;
  body._msg = { text, tags, login };
  body.appendChild(renderBody(body._msg));

  el.append(badges, name, colon, body);
  addLine(el);

  get7tvStyle(tags['user-id']).then(style => {
    if (!style || !el.isConnected) return;
    if (style.badge?.host?.url) {
      badges.appendChild(makeImg(stvAsset(style.badge.host.url, HI_RES ? '3x' : '2x'), style.badge.tooltip || style.badge.name));
    }
    if (style.paint) applyPaint(name, style.paint, color);
  });
}

function status(text, ttl = 5000) {
  const el = document.createElement('div');
  el.className = 'msg status';
  el.textContent = text;
  addLine(el);
  if (ttl) setTimeout(() => el.remove(), ttl);
}

// ---------------------------------------------------------------- IRC
function unescapeTag(v) {
  return v.replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
}

function parseIRC(line) {
  const msg = { tags: {}, prefix: '', command: '', params: [] };
  let rest = line;
  if (rest[0] === '@') {
    const sp = rest.indexOf(' ');
    for (const kv of rest.slice(1, sp).split(';')) {
      const eq = kv.indexOf('=');
      if (eq < 0) msg.tags[kv] = '';
      else msg.tags[kv.slice(0, eq)] = unescapeTag(kv.slice(eq + 1));
    }
    rest = rest.slice(sp + 1);
  }
  if (rest[0] === ':') {
    const sp = rest.indexOf(' ');
    msg.prefix = rest.slice(1, sp);
    rest = rest.slice(sp + 1);
  }
  let trailing = null;
  const t = rest.indexOf(' :');
  if (t >= 0) { trailing = rest.slice(t + 2); rest = rest.slice(0, t); }
  const parts = rest.split(' ').filter(Boolean);
  msg.command = parts.shift() || '';
  msg.params = parts;
  if (trailing !== null) msg.params.push(trailing);
  return msg;
}

let irc;

// Connection-level commands run immediately; everything else waits for the
// emote lists (see chat gating) so chat and moderation events keep their order.
const IMMEDIATE = new Set(['PING', 'RECONNECT', 'ROOMSTATE']);

function handle(msg) {
  switch (msg.command) {
    case 'PING':
      irc.send('PONG :' + (msg.params[0] || 'tmi.twitch.tv'));
      break;
    case 'RECONNECT':
      irc.close();
      break;
    case 'ROOMSTATE':
      if (msg.tags['room-id']) resolveRoomId(msg.tags['room-id']);
      break;
    case 'PRIVMSG': {
      const login = msg.prefix.split('!')[0];
      const text = msg.params[1] || '';
      if (hiddenUsers.has(login)) return;
      if (CONFIG.hideCommands && text.startsWith('!')) return;
      renderMessage(msg.tags, login, text);
      break;
    }
    case 'USERNOTICE': {
      const sys = msg.tags['system-msg'];
      if (CONFIG.notices && sys) renderMessage(msg.tags, msg.tags.login || '', msg.params[1] || '', { notice: sys });
      break;
    }
    case 'CLEARCHAT': {
      const uid = msg.tags['target-user-id'];
      if (uid) chatEl.querySelectorAll(`[data-user="${CSS.escape(uid)}"]`).forEach(e => e.remove());
      else chatEl.replaceChildren();
      break;
    }
    case 'CLEARMSG': {
      const id = msg.tags['target-msg-id'];
      if (id) chatEl.querySelector(`[data-id="${CSS.escape(id)}"]`)?.remove();
      break;
    }
    case 'NOTICE':
      console.warn('NOTICE', msg.params.join(' '));
      break;
  }
}

function connectChat() {
  irc = reconnectingSocket('wss://irc-ws.chat.twitch.tv:443', {
    onOpen: (sock) => {
      sock.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      sock.send('PASS SCHMOOPIIE');
      sock.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
      sock.send('JOIN #' + CONFIG.channel);
      status(`Connected to #${CONFIG.channel}`);
    },
    onMessage: (data) => {
      for (const line of data.split('\r\n')) {
        if (!line) continue;
        const msg = parseIRC(line);
        if (IMMEDIATE.has(msg.command)) handle(msg);
        else whenReady(() => handle(msg));
      }
    },
  });
}

// ---------------------------------------------------------------- start
if (!CONFIG.channel || CONFIG.channel === DEFAULTS.channel.toLowerCase()) {
  status('Set ?channel=yourchannel in the URL or edit DEFAULTS.channel in chat.html', 0);
} else {
  // Restore cached lists first so chat can render emotes immediately.
  const cachedGlobal = restoreGlobalCache();
  const cachedChannel = restoreChannelCache();
  if (cachedGlobal && cachedChannel) markReady();
  prefetchAll();

  // Everything below runs in parallel.
  connectChat();
  lookupRoomId();
  const globalDone = loadGlobal();
  const channelDone = roomIdReady.then(loadChannel);
  Promise.all([globalDone, channelDone]).then(() => { progress.seal(); markReady(); });
  setTimeout(markReady, 8000);
}
</script>
